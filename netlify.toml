[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"

# Block sensitive files
[[redirects]]
  from = "/.env"
  to = "/404.html"
  status = 404
[[redirects]]
  from = "/server.js"
  to = "/404.html"
  status = 404
[[redirects]]
  from = "/package.json"
  to = "/404.html"
  status = 404
[[redirects]]
  from = "/package-lock.json"
  to = "/404.html"
  status = 404
[[redirects]]
  from = "/.gitignore"
  to = "/404.html"
  status = 404

# API → Netlify Functions
[[redirects]]
  from = "/api/auth/signup"
  to = "/.netlify/functions/auth-signup"
  status = 200
[[redirects]]
  from = "/api/auth/login"
  to = "/.netlify/functions/auth-login"
  status = 200
[[redirects]]
  from = "/api/auth/me"
  to = "/.netlify/functions/auth-me"
  status = 200
[[redirects]]
  from = "/api/contact"
  to = "/.netlify/functions/contact"
  status = 200
